apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-gateway
  namespace: ml-platform
  labels:
    app: ml-platform-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-platform-gateway
  template:
    metadata:
      labels:
        app: ml-platform-gateway
    spec:
      containers:
        - name: gateway
          image: ml-platform-gateway:local
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ml-platform-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
